services:
  postgres:
    image: postgres:16-alpine
    container_name: dts-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dts_db}
      POSTGRES_USER: ${POSTGRES_USER:-dts_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dts_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dts_user} -d ${POSTGRES_DB:-dts_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: dts-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dts_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dts_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dts_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-production-secret-with-at-least-32-chars}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: dts-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:

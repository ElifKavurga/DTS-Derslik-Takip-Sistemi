services:
  postgres:
    image: postgres:16-alpine
    container_name: dts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dts_db}
      POSTGRES_USER: ${POSTGRES_USER:-dts_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dts_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dts-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dts_user} -d ${POSTGRES_DB:-dts_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: dts-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dts_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-dts_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dts_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-production-secret-with-at-least-32-chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-60}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-10080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"
    networks:
      - dts-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: dts-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - dts-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:

networks:
  dts-network:
    driver: bridge

spring:
  datasource:
    url: jdbc:h2:mem:dts_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

application:
  cors:
    allowed-origins: http://localhost:5173
  security:
    jwt:
      secret: test-development-secret-with-at-least-32-chars
      expiration-minutes: 60
      refresh-expiration-minutes: 10080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:dts_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:test-development-secret-with-at-least-32-chars}
      expiration-minutes: ${JWT_EXPIRATION:60}

logging:
  level:
    root: WARN
    com.dts.dersliktakip: INFO

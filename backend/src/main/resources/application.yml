server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dts-derslik-takip
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    out-of-order: false

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-chars}
      expiration-minutes: ${JWT_EXPIRATION:60}
      refresh-expiration-minutes: ${JWT_REFRESH_EXPIRATION:10080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.dts.dersliktakip: INFO
    org.springframework.security: INFO
